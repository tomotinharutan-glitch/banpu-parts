<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#10141b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TsurumiPump">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <title>TsurumiPump Parts App PWA (Firebase)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #10141b;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
            background: #0b1220;
            border-bottom: 1px solid #303846;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        h1 { margin: 0; font-size: 21px; }
        .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        nav {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #111827;
            position: sticky;
            top: 72px;
            z-index: 4;
        }
        button {
            border: 1px solid #4b5563;
            border-radius: 10px;
            padding: 10px 14px;
            background: #202833;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button.primary { background: #2563eb; border-color: #2563eb; }
        button.active { background: #374151; }
        main { max-width: 1050px; margin: auto; padding: 15px; }
        .page { display: none; }
        .page.active { display: block; }
        .panel { background: #18202d; border: 1px solid #374151; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #4b5563;
            border-radius: 9px;
            background: #0d1420;
            color: #fff;
            font-size: 15px;
        }
        .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 9px; margin-top: 10px; }
        .photo { position: relative; }
        .photo img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #fff;
            border-radius: 9px;
            border: 1px solid #4b5563;
        }
        .remove {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 5px 8px;
            border-radius: 8px;
            background: #111827;
            border: 1px solid #4b5563;
            color: #fff;
            font-size: 12px;
        }
        .sectionTitle { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .small { font-size: 12px; color: #9ca3af; }
        .notice { padding: 10px; background: #132a46; border: 1px solid #2563eb; border-radius: 9px; font-size: 12px; }
        .card { background: #0d1420; border: 1px solid #374151; border-radius: 12px; padding: 10px; }
        .card img { width: 100%; height: 210px; object-fit: contain; background: #fff; border-radius: 8px; }
        .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #2d3748; }
        .row span { text-align: right; color: #d1d5db; }
        .result { display: grid; grid-template-columns: 180px 1fr; gap: 15px; }
        .hidden { display: none; }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.86);
            z-index: 20;
            padding: 18px;
            padding-top: calc(18px + env(safe-area-inset-top));
        }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modalBox {
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            background: #18202d;
            border: 1px solid #4b5563;
            border-radius: 15px;
            padding: 12px;
            position: relative;
            overflow: auto;
        }
        .modalClose { position: absolute; right: 10px; top: 8px; font-size: 22px; padding: 6px 11px; background: none; border: none; color: #fff; cursor: pointer; }
        .modalImg { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #fff; border-radius: 10px; }
        .photoButtons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .photoButtons button { background: #26354d; }
        .pickButton {
            display: inline-block;
            border: 1px solid #4b5563;
            border-radius: 10px;
            padding: 10px 14px;
            background: #202833;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 9px;
            text-align: center;
        }
        .photoActionRow { display: flex; gap: 8px; flex-wrap: nowrap; align-items: stretch; margin-top: 9px; }
        .photoActionRow .pickButton { margin-top: 0; flex: 1; min-width: 0; padding: 10px 8px; font-size: 14px; }
        .backupPanel { margin: 10px 0; padding: 12px; border-radius: 12px; }
        #appContainer { display: none; }
    </style>
</head>
<body>

<!-- Authentication Overlay -->
<div id="authOverlay" class="modal show" style="background:#10141b; z-index:100;">
    <div class="modalBox" style="max-width: 400px; text-align: left;">
        <h2 style="margin-top:0; text-align: center;">🔐 TsurumiPump Parts App</h2>
        <div class="small" style="margin-bottom:8px; text-align: center; color:#9ca3af;">会社メンバー共有ログイン / 新規登録</div>
        <div class="small" style="margin-bottom:15px; text-align: center; color:#93c5fd; font-weight:700;">会社メールアドレスのみ登録できます（@tsurumipump.co.jp）</div>
        <div class="field">
            <label for="authEmail">メールアドレス</label>
            <input id="authEmail" type="email" placeholder="example@tsurumipump.co.jp" autocomplete="email">
        </div>
        <div class="field">
            <label for="authPassword">パスワード</label>
            <input id="authPassword" type="password" placeholder="パスワード" autocomplete="current-password">
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button id="btnLogin" class="primary" style="flex:1;">ログイン</button>
            <button id="btnSignup" style="flex:1; background:#374151;">新規登録</button>
        </div>
        <div id="verifyActionRow" style="display:none; margin-top:12px; gap:8px; flex-direction:column;">
            <button id="btnResend" style="background:#1e40af; width:100%;">確認メールを再送信</button>
            <button id="btnCheckVerified" style="background:#047857; width:100%;">確認完了したらクリック (状態更新)</button>
        </div>
        <div id="authMessage" class="small" style="margin-top:12px; color:#ff4d4f; text-align:center; min-height:18px;"></div>
    </div>
</div>

<!-- Main App Container (Gated by Auth) -->
<div id="appContainer">
    <div id="userBar" style="background:#111827; padding:8px 16px; border-bottom:1px solid #374151; display:flex; justify-content:space-between; align-items:center; font-size:13px;">
        <span id="userEmailDisplay" style="color:#9ca3af;"></span>
        <button id="btnLogout" style="padding:6px 10px; font-size:12px; background:#dc2626; border-color:#dc2626;">ログアウト</button>
    </div>

    <div class="panel backupPanel" style="margin: 15px; max-width: 1050px; margin-left: auto; margin-right: auto;">
        <h3>🛡️ データを守る (Firebase共有 ＆ ローカル)</h3>
        <div class="small">Cloud Firestore ＆ Cloud Storageで全メンバーと同期します。</div>
        <div class="photoActionRow" style="margin-top:8px">
            <button type="button" class="pickButton" id="btnBackup">💾 バックアップ (JSON)</button>
            <button type="button" class="pickButton" id="btnRestore">♻️ 復元</button>
        </div>
        <button type="button" class="pickButton" id="btnMigrateLocal" style="background:#047857; border-color:#047857; width:100%; margin-top:8px;">📥 ローカルIndexedDBデータをFirebaseへ移行</button>
        <div id="backupStatus" class="small" style="margin-top:8px"></div>
        <div id="backupCurrentCount" class="small" style="margin-top:4px"></div>
    </div>

    <header>
        <h1>📷 TsurumiPump フォト検索 (Firebase共有版)</h1>
        <div class="sub">Cloud Firestore / Cloud Storage</div>
        <div id="headerDataCount" class="sub" style="margin-top:6px"></div>
    </header>

    <nav>
        <button id="bReg" class="active">📷 部品を登録</button>
        <button id="bSearch">🔎 管理番号で検索</button>
    </nav>

    <main>
        <section id="searchPage" class="page">
            <div class="panel">
                <h2>🔎 管理番号で検索</h2>
                <div class="field">
                    <label for="searchManagement">管理番号</label>
                    <input id="searchManagement" placeholder="例：Z1585A_S2" autocomplete="off">
                </div>
                <div class="field">
                    <label for="searchPartNo">品番</label>
                    <input id="searchPartNo" placeholder="品番の一部でも検索できます" autocomplete="off">
                </div>
                <div class="field">
                    <label for="searchPartName">品名</label>
                    <input id="searchPartName" placeholder="品名の一部でも検索できます" autocomplete="off">
                </div>
                <button class="primary" style="margin-top:9px" id="btnRunSearch">🔎 検索</button>
                <div id="managementSearchResult" style="margin-top:12px"></div>
            </div>
        </section>

        <section id="regPage" class="page active">
            <div class="panel">
                <h2>📷 部品を登録 (Firebase同期)</h2>
                <div class="photoActionRow" style="margin:8px 0 12px">
                    <button type="button" class="pickButton" id="btnNewReg">🆕 新規登録</button>
                </div>

                <div class="panel">
                    <div class="sectionTitle"><h3>砂型形状</h3><span class="small">複数枚・方向自由</span></div>
                    <input id="sandInput" type="file" accept="image/*" multiple style="display:none">
                    <input id="sandCamera" type="file" accept="image/*" capture="environment" style="display:none">
                    <div class="photoActionRow">
                        <button type="button" class="pickButton" onclick="document.getElementById('sandInput').click()">🖼️ 写真を選択</button>
                        <button type="button" class="pickButton" onclick="document.getElementById('sandCamera').click()">📷 撮影</button>
                    </div>
                    <div id="sandPhotos" class="photos"></div>
                </div>

                <div class="grid">
                    <div class="field"><label for="management">管理番号 *</label><input id="management" placeholder="例：Z1221A-S2"></div>
                    <div class="field"><label for="partNo">品番</label><input id="partNo" placeholder="例：S1-00855-1"></div>
                    <div class="field"><label for="partName">品名</label><input id="partName" placeholder="例：ポンプケーシング"></div>
                    <div class="field"><label for="material">材質</label><input id="material" placeholder="例：FC250"></div>
                    <div class="field"><label for="quantity">数量</label><input id="quantity" inputmode="numeric"></div>
                    <div class="field"><label for="castingWeight">鋳込み重量</label><input id="castingWeight" inputmode="decimal"></div>
                    <div class="field"><label for="due">納期</label><input type="date" id="due"></div>
                </div>

                <div class="panel">
                    <div class="sectionTitle"><h3>素材形状</h3><span class="small">1枚</span></div>
                    <input id="materialInput" type="file" accept="image/*" style="display:none">
                    <input id="materialCamera" type="file" accept="image/*" capture="environment" style="display:none">
                    <div class="photoActionRow">
                        <button type="button" class="pickButton" onclick="document.getElementById('materialInput').click()">🖼️ 写真を選択</button>
                        <button type="button" class="pickButton" onclick="document.getElementById('materialCamera').click()">📷 撮影</button>
                    </div>
                    <div id="materialPhoto" class="photos"></div>
                </div>

                <div class="panel">
                    <div class="sectionTitle"><h3>鋳造方案形状</h3><span class="small">1枚</span></div>
                    <input id="planInput" type="file" accept="image/*" style="display:none">
                    <input id="planCamera" type="file" accept="image/*" capture="environment" style="display:none">
                    <div class="photoActionRow">
                        <button type="button" class="pickButton" onclick="document.getElementById('planInput').click()">🖼️ 写真を選択</button>
                        <button type="button" class="pickButton" onclick="document.getElementById('planCamera').click()">📷 撮影</button>
                    </div>
                    <div id="planPhoto" class="photos"></div>
                </div>

                <div class="field"><label>備考</label><textarea id="memo"></textarea></div>
                <button class="primary" style="width:100%" id="btnSavePart">登録・保存 (Firestore送信)</button>
                <div id="saveMessage" style="margin-top:10px"></div>
            </div>
        </section>

        <div id="photoModal" class="modal">
            <div class="modalBox">
                <button class="modalClose" id="btnModalClose">×</button>
                <h3 id="modalTitle"></h3>
                <img id="modalImg" class="modalImg" alt="拡大画像">
            </div>
        </div>
    </main>
</div>

<script type="module">
    import localStorageDB from './storage.js';
    import {
        auth,
        db,
        storage as fbStorage,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        sendEmailVerification,
        collection,
        addDoc,
        setDoc,
        doc,
        getDocs,
        deleteDoc,
        ref,
        uploadString,
        getDownloadURL
    } from './firebase-config.js';

    let sandFiles = [];
    let sandBase64Cache = [];
    let materialFile = null;
    let materialBase64Cache = "";
    let planFile = null;
    let planBase64Cache = "";
    let currentUser = null;

    function isCompanyEmail(email) {
        return email && email.toLowerCase().endsWith('@tsurumipump.co.jp');
    }

    // --- Auth State Handling ---
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const authOverlay = document.getElementById('authOverlay');
        const appContainer = document.getElementById('appContainer');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const authMessage = document.getElementById('authMessage');
        const verifyActionRow = document.getElementById('verifyActionRow');

        if (user) {
            if (!isCompanyEmail(user.email)) {
                authMessage.style.color = '#ff4d4f';
                authMessage.textContent = '会社のメールアドレス（@tsurumipump.co.jp）ではありません。';
                verifyActionRow.style.display = 'none';
                authOverlay.classList.add('show');
                appContainer.style.display = 'none';
                await signOut(auth);
                return;
            }

            if (!user.emailVerified) {
                authMessage.style.color = '#ff4d4f';
                authMessage.textContent = 'メールアドレスの確認が必要です。確認メールをご確認ください。';
                verifyActionRow.style.display = 'flex';
                authOverlay.classList.add('show');
                appContainer.style.display = 'none';
                return;
            }

            verifyActionRow.style.display = 'none';
            authMessage.textContent = '';
            authOverlay.classList.remove('show');
            appContainer.style.display = 'block';
            userEmailDisplay.textContent = `ログイン中: ${user.email}`;
            await initApp();
        } else {
            verifyActionRow.style.display = 'none';
            authOverlay.classList.add('show');
            appContainer.style.display = 'none';
        }
    });

    document.getElementById('btnLogin').onclick = async () => {
        const email = document.getElementById('authEmail').value.trim();
        const pass = document.getElementById('authPassword').value;
        const msg = document.getElementById('authMessage');
        const verifyActionRow = document.getElementById('verifyActionRow');
        verifyActionRow.style.display = 'none';

        if (!email || !pass) {
            msg.style.color = '#ff4d4f';
            msg.textContent = 'メールアドレスとパスワードを入力してください。';
            return;
        }

        if (!isCompanyEmail(email)) {
            msg.style.color = '#ff4d4f';
            msg.textContent = '会社のメールアドレス（@tsurumipump.co.jp）でログインしてください。';
            return;
        }

        msg.style.color = '#f5f5f5';
        msg.textContent = 'ログイン中...';
        try {
            const res = await signInWithEmailAndPassword(auth, email, pass);
            if (!res.user.emailVerified) {
                msg.style.color = '#ff4d4f';
                msg.textContent = 'メールアドレスの確認が必要です。確認メールのリンクを開いてください。';
                verifyActionRow.style.display = 'flex';
                return;
            }
            msg.textContent = '';
        } catch (e) {
            msg.style.color = '#ff4d4f';
            msg.textContent = 'ログインエラー: ' + e.message;
        }
    };

    document.getElementById('btnSignup').onclick = async () => {
        const email = document.getElementById('authEmail').value.trim();
        const pass = document.getElementById('authPassword').value;
        const msg = document.getElementById('authMessage');
        const verifyActionRow = document.getElementById('verifyActionRow');
        verifyActionRow.style.display = 'none';

        if (!email || !pass) {
            msg.style.color = '#ff4d4f';
            msg.textContent = 'メールアドレスとパスワードを入力してください。';
            return;
        }

        if (!isCompanyEmail(email)) {
            msg.style.color = '#ff4d4f';
            msg.textContent = '会社のメールアドレス（@tsurumipump.co.jp）で登録してください。';
            return;
        }

        msg.style.color = '#f5f5f5';
        msg.textContent = 'アカウント作成中...';
        try {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            await sendEmailVerification(res.user);
            msg.style.color = '#34d399';
            msg.textContent = '確認メールを送信しました。メール内のリンクを開いて確認してください。';
            verifyActionRow.style.display = 'flex';
        } catch (e) {
            msg.style.color = '#ff4d4f';
            msg.textContent = '登録エラー: ' + e.message;
        }
    };

    document.getElementById('btnResend').onclick = async () => {
        const msg = document.getElementById('authMessage');
        if (auth.currentUser) {
            try {
                await sendEmailVerification(auth.currentUser);
                msg.style.color = '#34d399';
                msg.textContent = '確認メールを再送信しました。';
            } catch (e) {
                msg.style.color = '#ff4d4f';
                msg.textContent = '再送信エラー: ' + e.message;
            }
        }
    };

    document.getElementById('btnCheckVerified').onclick = async () => {
        const msg = document.getElementById('authMessage');
        if (auth.currentUser) {
            msg.style.color = '#f5f5f5';
            msg.textContent = '確認状態を確認中...';
            try {
                await auth.currentUser.reload();
                if (auth.currentUser.emailVerified) {
                    msg.style.color = '#34d399';
                    msg.textContent = 'メール確認が完了しました！アプリを起動します...';
                    setTimeout(() => { window.location.reload(); }, 1000);
                } else {
                    msg.style.color = '#ff4d4f';
                    msg.textContent = 'まだメール確認が完了していません。メール内のリンクをご確認ください。';
                }
            } catch (e) {
                msg.style.color = '#ff4d4f';
                msg.textContent = '確認エラー: ' + e.message;
            }
        }
    };

    document.getElementById('btnLogout').onclick = async () => {
        if (confirm('ログアウトしますか？')) {
            await signOut(auth);
        }
    };

    // --- UI Helpers ---
    function tab(id) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('bSearch').classList.toggle('active', id === 'searchPage');
        document.getElementById('bReg').classList.toggle('active', id === 'regPage');
    }

    async function fileData(file) {
        return new Promise(resolve => {
            if (!file) { resolve(""); return; }
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const max = 1600;
                const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                const w = Math.max(1, Math.round(img.naturalWidth * scale));
                const h = Math.max(1, Math.round(img.naturalHeight * scale));
                const c = document.createElement("canvas");
                c.width = w; c.height = h;
                const ctx = c.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);
                const data = c.toDataURL("image/jpeg", 0.82);
                URL.revokeObjectURL(url);
                resolve(data);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
            img.src = url;
        });
    }

    async function renderSand() {
        const box = document.getElementById("sandPhotos");
        box.innerHTML = '';
        sandBase64Cache = [];
        for (let i = 0; i < sandFiles.length; i++) {
            const src = await fileData(sandFiles[i]);
            if (!src) continue;
            sandBase64Cache.push(src);
            const d = document.createElement('div');
            d.className = 'photo';
            d.innerHTML = `<img src="${src}" loading="lazy"><button class="remove" data-index="${i}">×</button>`;
            d.querySelector('.remove').onclick = (e) => {
                sandFiles.splice(e.target.dataset.index, 1);
                renderSand();
            };
            box.appendChild(d);
        }
    }

    async function renderOne(file, boxId, type) {
        const box = document.getElementById(boxId);
        box.innerHTML = '';
        if (type === 'material') materialBase64Cache = "";
        if (type === 'plan') planBase64Cache = "";
        if (file) {
            const src = await fileData(file);
            if (!src) return;
            if (type === 'material') materialBase64Cache = src;
            if (type === 'plan') planBase64Cache = src;
            const d = document.createElement('div');
            d.className = 'photo';
            d.innerHTML = `<img src="${src}" loading="lazy">`;
            box.appendChild(d);
        }
    }

    // --- Firebase Data Operations ---
    async function getAllFirestoreParts() {
        const snapshot = await getDocs(collection(db, "parts"));
        const list = [];
        snapshot.forEach(docSnap => {
            list.push({ ...docSnap.data(), id: docSnap.id });
        });
        return list;
    }

    async function initApp() {
        await updateCount();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    }

    async function updateCount() {
        try {
            const data = await getAllFirestoreParts();
            const photoCount = data.reduce((n, p) => n + (p.sand?.length || 0) + (p.materialShape ? 1 : 0) + (p.planShape ? 1 : 0), 0);
            const txt = `登録数: 部品 ${data.length}件 / 写真 ${photoCount}枚 (Cloud同期)`;
            document.getElementById("backupCurrentCount").textContent = txt;
            document.getElementById("headerDataCount").textContent = txt;
        } catch (e) {
            console.error("updateCount error:", e);
        }
    }

    async function uploadBase64ToStorage(path, base64Str) {
        if (!base64Str || !base64Str.startsWith('data:image')) return base64Str;
        const fileRef = ref(fbStorage, path);
        await uploadString(fileRef, base64Str, 'data_url');
        return await getDownloadURL(fileRef);
    }

    function withTimeout(promise, ms = 10000, errorMsg = "Firestoreへの保存がタイムアウトしました。ネットワーク接続を確認してください。") {
        let timer;
        const timeoutPromise = new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error(errorMsg)), ms);
        });
        return Promise.race([
            promise.then(val => { clearTimeout(timer); return val; }),
            timeoutPromise.catch(err => { clearTimeout(timer); throw err; })
        ]);
    }

    async function savePart() {
        if (!currentUser) { alert('ログインしていません。'); return; }
        const get = id => document.getElementById(id).value.trim();
        const recordId = String(Date.now());
        const record = {
            id: recordId,
            management: get("management"),
            partNo: get("partNo"),
            partName: get("partName"),
            material: get("material"),
            quantity: get("quantity"),
            castingWeight: get("castingWeight"),
            due: get("due"),
            memo: get("memo"),
            sand: [],
            materialShape: "",
            planShape: "",
            createdAt: new Date().toISOString(),
            createdBy: currentUser.email
        };

        if (!record.management) {
            alert("管理番号を入力してください。");
            return;
        }

        const msgEl = document.getElementById("saveMessage");
        msgEl.style.color = '#f5f5f5';
        msgEl.textContent = "📸 写真を処理中...";

        try {
            if (sandFiles.length > 0 && sandBase64Cache.length !== sandFiles.length) {
                sandBase64Cache = [];
                for (const f of sandFiles) {
                    const b64 = await fileData(f);
                    if (b64) sandBase64Cache.push(b64);
                }
            }
            if (materialFile && !materialBase64Cache) {
                materialBase64Cache = await fileData(materialFile);
            }
            if (planFile && !planBase64Cache) {
                planBase64Cache = await fileData(planFile);
            }

            msgEl.textContent = "☁️ Cloud Storageへアップロード中...";

            // Batch upload helper (2 concurrent at a time to prevent Safari socket overload)
            async function uploadInBatches(tasks, batchSize = 2) {
                const results = [];
                for (let i = 0; i < tasks.length; i += batchSize) {
                    const chunk = tasks.slice(i, i + batchSize);
                    const chunkResults = await Promise.all(chunk.map(task => task()));
                    results.push(...chunkResults);
                }
                return results;
            }

            const sandTasks = sandBase64Cache.map((b64, i) => async () => {
                const storagePath = `parts/${recordId}/sand_${i}_${Date.now()}.jpg`;
                return await uploadBase64ToStorage(storagePath, b64);
            });

            const otherTasks = [];
            if (materialBase64Cache) {
                otherTasks.push(async () => {
                    return await uploadBase64ToStorage(`parts/${recordId}/material_${Date.now()}.jpg`, materialBase64Cache);
                });
            }
            if (planBase64Cache) {
                otherTasks.push(async () => {
                    return await uploadBase64ToStorage(`parts/${recordId}/plan_${Date.now()}.jpg`, planBase64Cache);
                });
            }

            const sandUrls = await uploadInBatches(sandTasks, 2);
            const otherUrls = await uploadInBatches(otherTasks, 2);

            record.sand = sandUrls;
            if (materialBase64Cache) record.materialShape = otherUrls[0] || "";
            if (planBase64Cache) record.planShape = materialBase64Cache ? (otherUrls[1] || "") : (otherUrls[0] || "");

            msgEl.textContent = "💾 部品情報をFirestoreに保存中...";

            const firestorePromise = setDoc(doc(db, "parts", recordId), record);
            await withTimeout(firestorePromise, 10000);

            msgEl.style.color = '#34d399';
            msgEl.textContent = "登録完了: " + record.management;
            updateCount();
            alert("Firebaseに登録しました！");
        } catch (e) {
            let errorType = "保存エラー";
            let errorMsg = e.message || "";
            if (errorMsg.includes("タイムアウト")) {
                errorType = "タイムアウトエラー";
            } else if (errorMsg.includes("permission") || errorMsg.includes("権限")) {
                errorType = "権限エラー (Permission Denied)";
            } else if (errorMsg.includes("network") || errorMsg.includes("offline") || errorMsg.includes("Failed to fetch")) {
                errorType = "ネットワークエラー";
            } else if (errorMsg.includes("storage") || errorMsg.includes("Storage")) {
                errorType = "Storageアップロードエラー";
            } else {
                errorType = "Firestore保存エラー";
            }

            const fullMsg = `${errorType}: ${errorMsg}`;
            msgEl.style.color = '#ff4d4f';
            msgEl.textContent = fullMsg;
            alert(fullMsg);
        }
    }

    async function searchByManagement() {
        const mq = document.getElementById("searchManagement").value.trim().toLowerCase();
        const pq = document.getElementById("searchPartNo").value.trim().toLowerCase();
        const nq = document.getElementById("searchPartName").value.trim().toLowerCase();
        const box = document.getElementById("managementSearchResult");

        if (!mq && !pq && !nq) {
            box.innerHTML = '<div class="notice">検索条件を入力してください。</div>';
            return;
        }

        box.innerHTML = '<div class="notice">検索中...</div>';
        try {
            const data = await getAllFirestoreParts();
            const norm = s => String(s || "").toLowerCase().replace(/[\s_\-]/g, "");
            const mquery = norm(mq), pquery = norm(pq), nquery = norm(nq);

            const hits = data.filter(p => {
                const m = norm(p.management), pn = norm(p.partNo), nn = norm(p.partName);
                if (mquery && m.includes(mquery)) return true;
                if (pquery && pn.includes(pquery)) return true;
                if (nquery && nn.includes(nquery)) return true;
                return false;
            });

            if (!hits.length) {
                box.innerHTML = '<div class="notice">該当なし</div>';
                return;
            }

            box.innerHTML = hits.map(p => `
                <div class="panel">
                    <h3>⭐ ${p.management}</h3>
                    <div class="row">品番: <span>${p.partNo || ''}</span></div>
                    <div class="row">品名: <span>${p.partName || ''}</span></div>
                    <div class="row">材質: <span>${p.material || ''}</span></div>
                    <div class="row">数量: <span>${p.quantity || ''}</span></div>
                    <div class="row">鋳込み重量: <span>${p.castingWeight ? p.castingWeight + 'kg' : ''}</span></div>
                    <div class="row">納期: <span>${p.due || ''}</span></div>
                    <div class="row" style="display:block;text-align:left;">備考: <span style="text-align:left;color:#d1d5db;white-space:pre-wrap;word-break:break-all;">${p.memo || ''}</span></div>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
                        <button type="button" class="btnViewSand" data-id="${p.id}">📷 砂型</button>
                        <button type="button" class="btnViewMat" data-id="${p.id}">📷 素材</button>
                        <button type="button" class="btnViewPlan" data-id="${p.id}">📷 方案</button>
                        <button type="button" style="color:#ff4d4f" class="btnDelete" data-id="${p.id}">🗑️ 削除</button>
                    </div>
                </div>
            `).join('');

            box.querySelectorAll('.btnViewSand').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'sand'));
            box.querySelectorAll('.btnViewMat').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'material'));
            box.querySelectorAll('.btnViewPlan').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'plan'));
            box.querySelectorAll('.btnDelete').forEach(b => b.onclick = () => deletePart(b.dataset.id));
        } catch (e) {
            box.innerHTML = `<div class="notice">検索エラー: ${e.message}</div>`;
        }
    }

    async function showGallery(id, type) {
        const data = await getAllFirestoreParts();
        const p = data.find(x => x.id === id);
        if (!p) return;
        const modal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');

        let images = [];
        let title = '';
        if (type === 'sand') { images = p.sand || []; title = '砂型形状'; }
        if (type === 'material') { images = p.materialShape ? [p.materialShape] : []; title = '素材形状'; }
        if (type === 'plan') { images = p.planShape ? [p.planShape] : []; title = '鋳造方案形状'; }

        if (!images || !images.length) { alert('写真がありません'); return; }

        modalTitle.textContent = title;
        modalImg.alt = "読み込み中...";
        modalImg.src = ""; // Placeholder during load

        const imgObj = new Image();
        imgObj.onload = () => {
            modalImg.src = images[0];
            modalImg.alt = "拡大画像";
        };
        imgObj.onerror = () => {
            modalImg.alt = "写真の読み込みに失敗しました";
            alert('写真の読み込みに失敗しました。');
        };
        imgObj.src = images[0];

        modal.classList.add('show');

        const box = modal.querySelector('.modalBox');
        let old = box.querySelector('.photoButtons');
        if (old) old.remove();

        if (images.length > 1) {
            const nav = document.createElement('div');
            nav.className = 'photoButtons';
            images.forEach((src, i) => {
                const b = document.createElement('button');
                b.textContent = `写真 ${i+1}`;
                b.onclick = () => {
                    modalImg.alt = "読み込み中...";
                    const subImg = new Image();
                    subImg.onload = () => {
                        modalImg.src = src;
                        modalImg.alt = "拡大画像";
                    };
                    subImg.onerror = () => {
                        modalImg.alt = "読み込み失敗";
                    };
                    subImg.src = src;
                };
                nav.appendChild(b);
            });
            box.appendChild(nav);
        }
    }

    async function deletePart(id) {
        if (!confirm('この部品データを削除しますか？')) return;
        try {
            await deleteDoc(doc(db, "parts", id));
            searchByManagement();
            updateCount();
            alert('削除しました');
        } catch (e) {
            alert('削除エラー: ' + e.message);
        }
    }

    // --- Local IndexedDB Migration Feature ---
    async function migrateLocalToFirebase() {
        if (!currentUser) { alert('ログインしてください。'); return; }
        try {
            await localStorageDB.init();
            const localData = await localStorageDB.getAll();
            if (!localData || localData.length === 0) {
                alert('移行するローカルデータ（IndexedDB）がありません。');
                return;
            }

            if (!confirm(`ローカルに保存されている ${localData.length} 件のデータをFirebaseへ移行しますか？\n（既にFirestoreにある管理番号は重複登録されません）`)) {
                return;
            }

            const statusEl = document.getElementById('backupStatus');
            statusEl.textContent = '移行中...';

            const firestoreData = await getAllFirestoreParts();
            const existingIds = new Set(firestoreData.map(x => x.id));
            const existingManagements = new Set(firestoreData.map(x => String(x.management || "").trim().toLowerCase()));

            let count = 0;
            for (const p of localData) {
                const mgmt = String(p.management || "").trim().toLowerCase();
                if (existingIds.has(p.id) || (mgmt && existingManagements.has(mgmt))) {
                    continue; // Skip duplicate
                }

                const newId = p.id || String(Date.now() + Math.random());
                const record = {
                    id: newId,
                    management: p.management || "",
                    partNo: p.partNo || "",
                    partName: p.partName || "",
                    material: p.material || "",
                    quantity: p.quantity || "",
                    castingWeight: p.castingWeight || "",
                    due: p.due || "",
                    memo: p.memo || "",
                    sand: [],
                    materialShape: "",
                    planShape: "",
                    createdAt: p.createdAt || new Date().toISOString(),
                    createdBy: currentUser.email
                };

                // Migrate sand photos (if base64 or url)
                if (Array.isArray(p.sand)) {
                    for (let i = 0; i < p.sand.length; i++) {
                        const imgData = p.sand[i];
                        if (imgData.startsWith('data:image')) {
                            const storagePath = `parts/${newId}/sand_${i}_${Date.now()}.jpg`;
                            try {
                                const url = await uploadBase64ToStorage(storagePath, imgData);
                                record.sand.push(url);
                            } catch (err) {
                                console.error("Sand photo upload failed", err);
                            }
                        } else {
                            record.sand.push(imgData);
                        }
                    }
                }

                // Migrate material shape
                if (p.materialShape) {
                    if (p.materialShape.startsWith('data:image')) {
                        const storagePath = `parts/${newId}/material_${Date.now()}.jpg`;
                        try {
                            record.materialShape = await uploadBase64ToStorage(storagePath, p.materialShape);
                        } catch (err) { console.error("Material upload failed", err); }
                    } else {
                        record.materialShape = p.materialShape;
                    }
                }

                // Migrate plan shape
                if (p.planShape) {
                    if (p.planShape.startsWith('data:image')) {
                        const storagePath = `parts/${newId}/plan_${Date.now()}.jpg`;
                        try {
                            record.planShape = await uploadBase64ToStorage(storagePath, p.planShape);
                        } catch (err) { console.error("Plan upload failed", err); }
                    } else {
                        record.planShape = p.planShape;
                    }
                }

                await setDoc(doc(db, "parts", newId), record);
                existingIds.add(newId);
                if (mgmt) existingManagements.add(mgmt);
                count++;
            }

            statusEl.textContent = `✅ 移行完了: 新規 ${count} 件をFirebaseへ追加しました`;
            updateCount();
            alert(`ローカルデータのFirebase移行が完了しました！（新規追加: ${count}件）\n※ローカルデータは安全のため保持されています。`);
        } catch (e) {
            console.error("Migration error:", e);
            alert('移行エラー: ' + e.message);
        }
    }

    async function backupData() {
        try {
            const data = await getAllFirestoreParts();
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tsurumipump_firebase_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            document.getElementById('backupStatus').textContent = '✅ バックアップ完了 (Firebaseデータ)';
        } catch (e) {
            alert('バックアップエラー: ' + e.message);
        }
    }

    function restoreData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            const text = await file.text();
            try {
                const data = JSON.parse(text);
                if (Array.isArray(data)) {
                    if (confirm(`バックアップファイルから ${data.length} 件のデータをFirebaseへ復元しますか？`)) {
                        document.getElementById('backupStatus').textContent = '復元中...';
                        for (const p of data) {
                            const recId = p.id || String(Date.now() + Math.random());
                            await setDoc(doc(db, "parts", recId), p);
                        }
                        updateCount();
                        document.getElementById('backupStatus').textContent = '✅ 復元完了';
                        alert('復元完了');
                    }
                }
            } catch (e) { alert('不正なファイル形式です'); }
        };
        input.click();
    }

    // --- Event Listeners ---
    document.getElementById('bReg').onclick = () => tab('regPage');
    document.getElementById('bSearch').onclick = () => tab('searchPage');
    document.getElementById('btnNewReg').onclick = () => {
        if (confirm('入力をリセットしますか？')) {
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            sandFiles = []; sandBase64Cache = [];
            materialFile = null; materialBase64Cache = "";
            planFile = null; planBase64Cache = "";
            renderSand();
            renderOne(null, 'materialPhoto', 'material');
            renderOne(null, 'planPhoto', 'plan');
        }
    };
    document.getElementById('btnSavePart').onclick = savePart;
    document.getElementById('btnRunSearch').onclick = searchByManagement;
    document.getElementById('btnBackup').onclick = backupData;
    document.getElementById('btnRestore').onclick = restoreData;
    document.getElementById('btnMigrateLocal').onclick = migrateLocalToFirebase;
    document.getElementById('btnModalClose').onclick = () => document.getElementById('photoModal').classList.remove('show');

    document.getElementById('sandInput').onchange = (e) => {
        sandFiles.push(...e.target.files);
        renderSand();
    };
    document.getElementById('sandCamera').onchange = (e) => {
        if (e.target.files[0]) sandFiles.push(e.target.files[0]);
        renderSand();
    };
    document.getElementById('materialInput').onchange = (e) => {
        materialFile = e.target.files[0];
        renderOne(materialFile, 'materialPhoto', 'material');
    };
    document.getElementById('materialCamera').onchange = (e) => {
        materialFile = e.target.files[0];
        renderOne(materialFile, 'materialPhoto', 'material');
    };
    document.getElementById('planInput').onchange = (e) => {
        planFile = e.target.files[0];
        renderOne(planFile, 'planPhoto', 'plan');
    };
    document.getElementById('planCamera').onchange = (e) => {
        planFile = e.target.files[0];
        renderOne(planFile, 'planPhoto', 'plan');
    };

    window.onclick = (e) => {
        if (e.target.id === 'photoModal') e.target.classList.remove('show');
    };
</script>
