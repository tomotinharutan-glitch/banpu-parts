<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#10141b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BANPU">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <title>BANPU Parts App PWA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #10141b;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
            background: #0b1220;
            border-bottom: 1px solid #303846;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        h1 { margin: 0; font-size: 21px; }
        .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        nav {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #111827;
            position: sticky;
            top: 72px; /* Approx header height */
            z-index: 4;
        }
        button {
            border: 1px solid #4b5563;
            border-radius: 10px;
            padding: 10px 14px;
            background: #202833;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button.primary { background: #2563eb; border-color: #2563eb; }
        button.active { background: #374151; }
        main { max-width: 1050px; margin: auto; padding: 15px; }
        .page { display: none; }
        .page.active { display: block; }
        .panel { background: #18202d; border: 1px solid #374151; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
        .field { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #4b5563;
            border-radius: 9px;
            background: #0d1420;
            color: #fff;
            font-size: 15px;
        }
        .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 9px; margin-top: 10px; }
        .photo { position: relative; }
        .photo img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #fff;
            border-radius: 9px;
            border: 1px solid #4b5563;
        }
        .remove {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 5px 8px;
            border-radius: 8px;
            background: #111827;
            border: 1px solid #4b5563;
            color: #fff;
            font-size: 12px;
        }
        .sectionTitle { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .small { font-size: 12px; color: #9ca3af; }
        .notice { padding: 10px; background: #132a46; border: 1px solid #2563eb; border-radius: 9px; font-size: 12px; }
        .card { background: #0d1420; border: 1px solid #374151; border-radius: 12px; padding: 10px; }
        .card img { width: 100%; height: 210px; object-fit: contain; background: #fff; border-radius: 8px; }
        .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #2d3748; }
        .row span { text-align: right; color: #d1d5db; }
        .result { display: grid; grid-template-columns: 180px 1fr; gap: 15px; }
        .hero { width: 100%; height: 180px; object-fit: contain; background: #fff; border-radius: 10px; }
        .hidden { display: none; }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.86);
            z-index: 20;
            padding: 18px;
            padding-top: calc(18px + env(safe-area-inset-top));
        }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modalBox {
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            background: #18202d;
            border: 1px solid #4b5563;
            border-radius: 15px;
            padding: 12px;
            position: relative;
            overflow: auto;
        }
        .modalClose { position: absolute; right: 10px; top: 8px; font-size: 22px; padding: 6px 11px; background: none; border: none; color: #fff; }
        .modalImg { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #fff; border-radius: 10px; }
        .photoButtons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .photoButtons button { background: #26354d; }
        .pickButton {
            display: inline-block;
            border: 1px solid #4b5563;
            border-radius: 10px;
            padding: 10px 14px;
            background: #202833;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin-top: 9px;
            text-align: center;
        }
        .photoActionRow { display: flex; gap: 8px; flex-wrap: nowrap; align-items: stretch; margin-top: 9px; }
        .photoActionRow .pickButton { margin-top: 0; flex: 1; min-width: 0; padding: 10px 8px; font-size: 14px; }
        .backupPanel { margin: 10px 0; padding: 12px; border-radius: 12px; }
        .shapeTabs { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
        .shapeTab { border: 1px solid #4b5563; background: #202833; color: #fff; border-radius: 8px; padding: 8px 10px; font-weight: 700; cursor: pointer; }
        .shapeTab.active { background: #2563eb; border-color: #2563eb; }
        .searchShapePreview { margin-top: 7px; padding: 8px; border-radius: 10px; background: #0d1420; border: 1px solid #374151; }
        .searchShapeLabel { font-weight: 800; margin-bottom: 6px; color: #cbd5e1; }
        .searchShapeGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 7px; }
        .searchShapeGrid img { width: 100%; height: 95px; object-fit: contain; background: #fff; border-radius: 8px; border: 1px solid #4b5563; }
        @media(max-width: 650px) {
            .result { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="panel backupPanel">
    <h3>🛡️ データを守る (iPhone PWA)</h3>
    <div class="small">IndexedDBを使用して大容量データを保存します。</div>
    <div class="photoActionRow" style="margin-top:8px">
        <button type="button" class="pickButton" id="btnBackup">💾 バックアップ</button>
        <button type="button" class="pickButton" id="btnRestore">♻️ 復元</button>
    </div>
    <div id="backupStatus" class="small" style="margin-top:8px"></div>
    <div id="backupCurrentCount" class="small" style="margin-top:4px"></div>
</div>

<header>
    <h1>📷 BANPU フォト検索</h1>
    <div class="sub">iPhone Safari PWA (IndexedDB版)</div>
    <div id="headerDataCount" class="sub" style="margin-top:6px"></div>
</header>

<nav>
    <button id="bReg" class="active">📷 部品を登録</button>
    <button id="bSearch">🔎 管理番号で検索</button>
</nav>

<main>
    <section id="searchPage" class="page">
        <div class="panel">
            <h2>🔎 管理番号で検索</h2>
            <div class="field">
                <label for="searchManagement">管理番号</label>
                <input id="searchManagement" placeholder="例：Z1585A_S2" autocomplete="off">
            </div>
            <div class="field">
                <label for="searchPartNo">品番</label>
                <input id="searchPartNo" placeholder="品番の一部でも検索できます" autocomplete="off">
            </div>
            <div class="field">
                <label for="searchPartName">品名</label>
                <input id="searchPartName" placeholder="品名の一部でも検索できます" autocomplete="off">
            </div>
            <button class="primary" style="margin-top:9px" id="btnRunSearch">🔎 検索</button>
            <div id="managementSearchResult" style="margin-top:12px"></div>
        </div>
    </section>

    <section id="regPage" class="page active">
        <div class="panel">
            <h2>📷 部品を登録</h2>
            <div class="photoActionRow" style="margin:8px 0 12px">
                <button type="button" class="pickButton" id="btnNewReg">🆕 新規登録</button>
            </div>

            <div class="panel">
                <div class="sectionTitle"><h3>砂型形状</h3><span class="small">複数枚・方向自由</span></div>
                <input id="sandInput" type="file" accept="image/*" multiple style="display:none">
                <input id="sandCamera" type="file" accept="image/*" capture="environment" style="display:none">
                <div class="photoActionRow">
                    <button type="button" class="pickButton" onclick="document.getElementById('sandInput').click()">🖼️ 写真を選択</button>
                    <button type="button" class="pickButton" onclick="document.getElementById('sandCamera').click()">📷 撮影</button>
                </div>
                <div id="sandPhotos" class="photos"></div>
            </div>

            <div class="grid">
                <div class="field"><label for="management">管理番号 *</label><input id="management" placeholder="例：Z1221A-S2"></div>
                <div class="field"><label for="partNo">品番</label><input id="partNo" placeholder="例：S1-00855-1"></div>
                <div class="field"><label for="partName">品名</label><input id="partName" placeholder="例：ポンプケーシング"></div>
                <div class="field"><label for="material">材質</label><input id="material" placeholder="例：FC250"></div>
                <div class="field"><label for="quantity">数量</label><input id="quantity" inputmode="numeric"></div>
                <div class="field"><label for="castingWeight">鋳込み重量</label><input id="castingWeight" inputmode="decimal"></div>
                <div class="field"><label for="due">納期</label><input type="date" id="due"></div>
            </div>

            <div class="panel">
                <div class="sectionTitle"><h3>素材形状</h3><span class="small">1枚</span></div>
                <input id="materialInput" type="file" accept="image/*" style="display:none">
                <input id="materialCamera" type="file" accept="image/*" capture="environment" style="display:none">
                <div class="photoActionRow">
                    <button type="button" class="pickButton" onclick="document.getElementById('materialInput').click()">🖼️ 写真を選択</button>
                    <button type="button" class="pickButton" onclick="document.getElementById('materialCamera').click()">📷 撮影</button>
                </div>
                <div id="materialPhoto" class="photos"></div>
            </div>

            <div class="panel">
                <div class="sectionTitle"><h3>鋳造方案形状</h3><span class="small">1枚</span></div>
                <input id="planInput" type="file" accept="image/*" style="display:none">
                <input id="planCamera" type="file" accept="image/*" capture="environment" style="display:none">
                <div class="photoActionRow">
                    <button type="button" class="pickButton" onclick="document.getElementById('planInput').click()">🖼️ 写真を選択</button>
                    <button type="button" class="pickButton" onclick="document.getElementById('planCamera').click()">📷 撮影</button>
                </div>
                <div id="planPhoto" class="photos"></div>
            </div>

            <div class="field"><label>備考</label><textarea id="memo"></textarea></div>
            <button class="primary" style="width:100%" id="btnSavePart">登録・保存</button>
            <div id="saveMessage" style="margin-top:10px"></div>
        </div>
    </section>

    <div id="photoModal" class="modal">
        <div class="modalBox">
            <button class="modalClose" id="btnModalClose">×</button>
            <h3 id="modalTitle"></h3>
            <img id="modalImg" class="modalImg" alt="拡大画像">
        </div>
    </div>
</main>

<script type="module">
    import storage from './storage.js';

    let sandFiles = [];
    let materialFile = null;
    let planFile = null;

    // --- UI Helpers ---
    function tab(id) {
        document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('bSearch').classList.toggle('active', id === 'searchPage');
        document.getElementById('bReg').classList.toggle('active', id === 'regPage');
    }

    async function fileData(file) {
        return new Promise(resolve => {
            if (!file) { resolve(""); return; }
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const max = 800;
                const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                const w = Math.max(1, Math.round(img.naturalWidth * scale));
                const h = Math.max(1, Math.round(img.naturalHeight * scale));
                const c = document.createElement("canvas");
                c.width = w; c.height = h;
                const ctx = c.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);
                const data = c.toDataURL("image/jpeg", 0.7);
                URL.revokeObjectURL(url);
                resolve(data);
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
            img.src = url;
        });
    }

    async function renderSand() {
        const box = document.getElementById("sandPhotos");
        box.innerHTML = '';
        for (let i = 0; i < sandFiles.length; i++) {
            const src = await fileData(sandFiles[i]);
            if (!src) continue;
            const d = document.createElement('div');
            d.className = 'photo';
            d.innerHTML = `<img src="${src}"><button class="remove" data-index="${i}">×</button>`;
            d.querySelector('.remove').onclick = (e) => {
                sandFiles.splice(e.target.dataset.index, 1);
                renderSand();
            };
            box.appendChild(d);
        }
    }

    async function renderOne(file, boxId) {
        const box = document.getElementById(boxId);
        box.innerHTML = '';
        if (file) {
            const src = await fileData(file);
            if (!src) return;
            const d = document.createElement('div');
            d.className = 'photo';
            d.innerHTML = `<img src="${src}">`;
            box.appendChild(d);
        }
    }

    // --- Core Logic ---
    async function init() {
        await storage.init();
        updateCount();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    }

    async function updateCount() {
        const data = await storage.getAll();
        const photoCount = data.reduce((n, p) => n + (p.sand?.length || 0) + (p.materialShape ? 1 : 0) + (p.planShape ? 1 : 0), 0);
        const txt = `登録数: 部品 ${data.length}件 / 写真 ${photoCount}枚`;
        document.getElementById("backupCurrentCount").textContent = txt;
        document.getElementById("headerDataCount").textContent = txt;
    }

    async function savePart() {
        const get = id => document.getElementById(id).value.trim();
        const record = {
            id: String(Date.now()),
            management: get("management"),
            partNo: get("partNo"),
            partName: get("partName"),
            material: get("material"),
            quantity: get("quantity"),
            castingWeight: get("castingWeight"),
            due: get("due"),
            memo: get("memo"),
            sand: [],
            materialShape: "",
            planShape: "",
            createdAt: new Date().toISOString()
        };

        if (!record.management) {
            alert("管理番号を入力してください。");
            return;
        }

        document.getElementById("saveMessage").textContent = "保存中...";

        for (const f of sandFiles) record.sand.push(await fileData(f));
        if (materialFile) record.materialShape = await fileData(materialFile);
        if (planFile) record.planShape = await fileData(planFile);

        await storage.save(record);
        document.getElementById("saveMessage").textContent = "登録しました: " + record.management;
        updateCount();
        alert("登録完了");
    }

    async function searchByManagement() {
        const mq = document.getElementById("searchManagement").value.trim().toLowerCase();
        const pq = document.getElementById("searchPartNo").value.trim().toLowerCase();
        const nq = document.getElementById("searchPartName").value.trim().toLowerCase();
        const box = document.getElementById("managementSearchResult");

        if (!mq && !pq && !nq) {
            box.innerHTML = '<div class="notice">検索条件を入力してください。</div>';
            return;
        }

        const data = await storage.getAll();
        const norm = s => String(s || "").toLowerCase().replace(/[\s_\-]/g, "");
        const mquery = norm(mq), pquery = norm(pq), nquery = norm(nq);

        const hits = data.filter(p => {
            const m = norm(p.management), pn = norm(p.partNo), nn = norm(p.partName);
            if (mquery && m.includes(mquery)) return true;
            if (pquery && pn.includes(pquery)) return true;
            if (nquery && nn.includes(nquery)) return true;
            return false;
        });

        if (!hits.length) {
            box.innerHTML = '<div class="notice">該当なし</div>';
            return;
        }

        box.innerHTML = hits.map(p => `
            <div class="panel">
                <h3>⭐ ${p.management}</h3>
                <div class="row">品番: <span>${p.partNo || ''}</span></div>
                <div class="row">品名: <span>${p.partName || ''}</span></div>
                <div class="row">材質: <span>${p.material || ''}</span></div>
                <div class="row">数量: <span>${p.quantity || ''}</span></div>
                <div class="row">鋳込み重量: <span>${p.castingWeight ? p.castingWeight + 'kg' : ''}</span></div>
                <div class="row">納期: <span>${p.due || ''}</span></div>
                <div class="row" style="display:block;text-align:left;">備考: <span style="text-align:left;color:#d1d5db;white-space:pre-wrap;word-break:break-all;">${p.memo || ''}</span></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
                    <button type="button" class="btnViewSand" data-id="${p.id}">📷 砂型</button>
                    <button type="button" class="btnViewMat" data-id="${p.id}">📷 素材</button>
                    <button type="button" class="btnViewPlan" data-id="${p.id}">📷 方案</button>
                    <button type="button" style="color:#ff4d4f" class="btnDelete" data-id="${p.id}">🗑️ 削除</button>
                </div>
            </div>
        `).join('');

        // Attach event listeners to results
        box.querySelectorAll('.btnViewSand').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'sand'));
        box.querySelectorAll('.btnViewMat').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'material'));
        box.querySelectorAll('.btnViewPlan').forEach(b => b.onclick = () => showGallery(b.dataset.id, 'plan'));
        box.querySelectorAll('.btnDelete').forEach(b => b.onclick = () => deletePart(b.dataset.id));
    }

    async function showGallery(id, type) {
        const data = await storage.getAll();
        const p = data.find(x => x.id === id);
        if (!p) return;
        const modal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');

        let images = [];
        let title = '';
        if (type === 'sand') { images = p.sand; title = '砂型形状'; }
        if (type === 'material') { images = p.materialShape ? [p.materialShape] : []; title = '素材形状'; }
        if (type === 'plan') { images = p.planShape ? [p.planShape] : []; title = '鋳造方案形状'; }

        if (!images || !images.length) { alert('写真がありません'); return; }

        modalTitle.textContent = title;
        modalImg.src = images[0];
        modal.classList.add('show');

        const box = modal.querySelector('.modalBox');
        let old = box.querySelector('.photoButtons');
        if (old) old.remove();

        if (images.length > 1) {
            const nav = document.createElement('div');
            nav.className = 'photoButtons';
            images.forEach((src, i) => {
                const b = document.createElement('button');
                b.textContent = `写真 ${i+1}`;
                b.onclick = () => { modalImg.src = src; };
                nav.appendChild(b);
            });
            box.appendChild(nav);
        }
    }

    async function deletePart(id) {
        if (!confirm('削除しますか？')) return;
        await storage.delete(id);
        searchByManagement();
        updateCount();
    }

    async function backupData() {
        const data = await storage.getAll();
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `banpu_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        document.getElementById('backupStatus').textContent = '✅ バックアップ完了';
    }

    function restoreData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            const text = await file.text();
            try {
                const data = JSON.parse(text);
                if (Array.isArray(data)) {
                    if (confirm(`復元しますか？（現在のデータは削除されます）`)) {
                        await storage.clear();
                        for (const p of data) await storage.save(p);
                        updateCount();
                        alert('復元完了');
                    }
                }
            } catch (e) { alert('不正なファイル形式です'); }
        };
        input.click();
    }

    // --- Events ---
    document.getElementById('bReg').onclick = () => tab('regPage');
    document.getElementById('bSearch').onclick = () => tab('searchPage');
    document.getElementById('btnNewReg').onclick = () => {
        if (confirm('入力をリセットしますか？')) {
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            sandFiles = []; materialFile = null; planFile = null;
            renderSand();
            renderOne(null, 'materialPhoto');
            renderOne(null, 'planPhoto');
        }
    };
    document.getElementById('btnSavePart').onclick = savePart;
    document.getElementById('btnRunSearch').onclick = searchByManagement;
    document.getElementById('btnBackup').onclick = backupData;
    document.getElementById('btnRestore').onclick = restoreData;
    document.getElementById('btnModalClose').onclick = () => document.getElementById('photoModal').classList.remove('show');

    document.getElementById('sandInput').onchange = (e) => {
        sandFiles.push(...e.target.files);
        renderSand();
    };
    document.getElementById('sandCamera').onchange = (e) => {
        if (e.target.files[0]) sandFiles.push(e.target.files[0]);
        renderSand();
    };
    document.getElementById('materialInput').onchange = (e) => {
        materialFile = e.target.files[0];
        renderOne(materialFile, 'materialPhoto');
    };
    document.getElementById('materialCamera').onchange = (e) => {
        materialFile = e.target.files[0];
        renderOne(materialFile, 'materialPhoto');
    };
    document.getElementById('planInput').onchange = (e) => {
        planFile = e.target.files[0];
        renderOne(planFile, 'planPhoto');
    };
    document.getElementById('planCamera').onchange = (e) => {
        planFile = e.target.files[0];
        renderOne(planFile, 'planPhoto');
    };

    window.onclick = (e) => {
        if (e.target.id === 'photoModal') e.target.classList.remove('show');
    };

    init();
</script>
</body>
</html>
